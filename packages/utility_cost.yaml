template:
  - sensor:
      - name: Utility Active Tariff
        unique_id: utility_active_tariff
        state: >-
          {% set m = now().hour * 60 + now().minute %}
          {% if 360 <= m < 600 or 960 <= m < 1440 %}peak
          {% elif 600 <= m < 960 %}shoulder
          {% else %}offpeak{% endif %}
      - name: Utility Active Import Rate
        unique_id: utility_active_import_rate
        unit_of_measurement: AUD/kWh
        state_class: measurement
        state: >-
          {% set x = states('sensor.utility_active_tariff') %}
          {% if x == 'peak' %}{{ states('input_number.utility_peak_rate') }}
          {% elif x == 'shoulder' %}{{ states('input_number.utility_shoulder_rate') }}
          {% else %}{{ states('input_number.utility_offpeak_rate') }}{% endif %}
      - name: Utility Tracked Power
        unique_id: utility_tracked_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {{ ((states('sensor.evcc_delta_ac_max_smart_occp_charge_power')|float(0) * 1) + (states('sensor.kitchen_multi_power')|float(0) * 1) + (states('sensor.kitchen_zigbee_power')|float(0) * 1) + (states('sensor.chest_freezer_plug_power')|float(0) * 1)) | round(1) }}
      - name: Utility Untracked Power
        unique_id: utility_untracked_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >-
          {% set h = states('sensor.house_power')|float(0) %}
          {% set tr = states('sensor.utility_tracked_power')|float(0) %}
          {{ [h-tr,0]|max|round(1) }}
      - name: Utility Grid Import Cost Flow
        unique_id: utility_grid_import_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.solarnet_power_grid_import')|float(0)) / 1000 * (states('sensor.utility_active_import_rate')|float(0))) | round(6) }}
      - name: Utility Supply Cost Flow
        unique_id: utility_supply_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ (states('input_number.utility_supply_daily')|float(0) / 24) | round(6) }}
      - name: Utility EV Charger Cost Flow
        unique_id: utility_ev_charger_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.evcc_delta_ac_max_smart_occp_charge_power')|float(0)) / 1000 * (states('sensor.utility_active_import_rate')|float(0))) | round(6) }}
      - name: Utility Kitchen Plug Cost Flow
        unique_id: utility_kitchen_plug_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.kitchen_multi_power')|float(0)) / 1000 * (states('sensor.utility_active_import_rate')|float(0))) | round(6) }}
      - name: Utility Kettle Cost Flow
        unique_id: utility_kettle_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.kitchen_zigbee_power')|float(0)) / 1000 * (states('sensor.utility_active_import_rate')|float(0))) | round(6) }}
      - name: Utility Fridge / Chest Freezer Cost Flow
        unique_id: utility_fridge_freezer_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.chest_freezer_plug_power')|float(0)) / 1000 * (states('sensor.utility_active_import_rate')|float(0))) | round(6) }}
      - name: Utility Untracked Cost Flow
        unique_id: utility_untracked_cost_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.utility_untracked_power')|float(0)) / 1000 * (states('sensor.utility_active_import_rate')|float(0))) | round(6) }}
      - name: Utility Active FIT Rate
        unique_id: utility_active_fit_rate
        unit_of_measurement: AUD/kWh
        state_class: measurement
        state: >-
          {% set e = states('sensor.utility_grid_export_energy_daily')|float(0) %}
          {% set lim = states('input_number.utility_fit_threshold')|float(0) %}
          {{ states('input_number.utility_fit_tier1') if e < lim else states('input_number.utility_fit_tier2') }}
      - name: Utility Solar Credit Flow
        unique_id: utility_solar_credit_flow
        unit_of_measurement: AUD/h
        state_class: measurement
        state: >-
          {{ ((states('sensor.solarnet_power_grid_export')|float(0)) / 1000 * (states('sensor.utility_active_fit_rate')|float(0))) | round(6) }}

